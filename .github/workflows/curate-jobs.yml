name: "💼 Daily Job Radar Curation"

on:
  schedule:
    - cron: '0 11 * * *'          # 11:00 AM UTC every day (30 min after Tech Pulse)
  workflow_dispatch:                # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  curate:
    name: Fetch → Merge → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install tavily-python groq requests

      - name: Run job curation script
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/scripts/curate-jobs.py

      - name: Commit updated jobs
        run: |
          git config user.email "job-radar-bot@portfolio.com"
          git config user.name "Job Radar Bot"
          git add artifacts/how-its-built/public/jobs.json
          if git diff --cached --quiet; then
            echo "📭 No new jobs today — nothing to commit."
          else
            git commit -m "chore: daily job radar update [skip ci]"
            git push
            echo "✅ New jobs committed and pushed!"
          fi
