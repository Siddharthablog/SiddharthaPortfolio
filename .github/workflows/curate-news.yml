name: "🧠 Daily Tech Pulse Curation"

on:
  schedule:
    - cron: '0 10 * * *'          # 10:00 AM UTC, every day
  workflow_dispatch:                # manual trigger from GitHub UI

permissions:
  contents: write                   # needed to push insights.json back

jobs:
  curate:
    name: Fetch → Summarise → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout the repo ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install Python dependencies
        run: pip install tavily-python groq requests

      # ── 4. Run the curation engine ────────────────────────────
      - name: Run curation script
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/scripts/curate.py

      # ── 5. Commit & push if changed ──────────────────────────
      - name: Commit updated insights
        run: |
          git config user.email "tech-pulse-bot@portfolio.com"
          git config user.name "Tech Pulse Bot"
          git add artifacts/how-its-built/public/insights.json
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "📭 No new insights today — nothing to commit."
          else
            git commit -m "chore: daily tech pulse update [skip ci]"
            git push
            echo "✅ New insights committed and pushed!"
          fi
